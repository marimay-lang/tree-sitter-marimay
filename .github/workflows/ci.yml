name: Grammar CI

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  linux:
    name: Generate and test syntax grammar
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out grammar source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install locked grammar tooling
        run: npm ci
      - name: Test corpus, fixtures, and highlighting queries
        run: npm test
